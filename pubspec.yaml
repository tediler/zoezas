name: zoezas
description: "Zoëzas – deine persönliche Finanz-Begleiterin"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.0

# Versionen bewusst festgelegt: Flutter 3.35.2 / Dart 3.9 bleibt global installiert,
# neuere Paketversionen verlangen ein neueres Dart (siehe docs/DECISIONS.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State-Management & Navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3

  # Lokale Datenbank (SQLite über drift)
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  path: ^1.9.1

  # Hilfsbibliotheken
  intl: ^0.20.2
  collection: ^1.19.1

  # Plattform: Export/Import, Homescreen-Widget, App-Shortcuts
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  home_widget: ^0.9.2+1
  quick_actions: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.29.0

flutter:
  uses-material-design: true

  assets:
    # Lizenz der Schriften (SIL OFL verlangt, sie mitzuliefern)
    - assets/fonts/OFL.txt

  fonts:
    # UI-Schrift
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    # Serifenschrift für große Geldbeträge
    - family: Eczar
      fonts:
        - asset: assets/fonts/Eczar-Regular.ttf
        - asset: assets/fonts/Eczar-SemiBold.ttf
          weight: 600
    # Alternative Serifenschrift (zum Vergleich, siehe core/theme/typography.dart)
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Light.ttf
          weight: 300
        - asset: assets/fonts/Merriweather-Regular.ttf
